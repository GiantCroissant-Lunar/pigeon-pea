[package]
name = "dungeon-protocol"
version = "0.1.0"
edition = "2021"
authors = ["Pigeon Pea Team"]
license = "MIT"
repository = "https://github.com/GiantCroissant-Lunar/pigeon-pea"
description = "Shared protocol types for Pigeon Pea dungeon dev tools"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0" }
uuid = { version = "1.11", features = ["v4", "serde"] }
thiserror = { version = "1.0" }

[dev-dependencies]
tokio-test = { version = "0.4" }
