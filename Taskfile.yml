# Taskfile.yml
# Task runner configuration for pigeon-pea project
# Install Task: https://taskfile.dev/installation/
# Usage: task <task-name> or just `task` to see available tasks

version: '3'

tasks:
  skills:validate:
    desc: Validate all agent skills
    cmds:
      - python .agent/scripts/validate_skills.py

  agents:validate:
    desc: Validate all agent manifests
    cmds:
      - python .agent/scripts/validate_agents.py

  registry:generate:
    desc: Generate AGENTS.md registry from manifests
    cmds:
      - python .agent/scripts/generate_registry.py

  check:
    desc: Run all validations
    deps:
      - skills:validate
      - agents:validate
      - registry:generate

  dotnet:build:
    desc: Build .NET solution
    dir: ./dotnet
    cmds:
      - dotnet build PigeonPea.sln

  dotnet:test:
    desc: Run .NET tests
    dir: ./dotnet
    cmds:
      - dotnet test PigeonPea.sln

  dotnet:format:
    desc: Format .NET code
    dir: ./dotnet
    cmds:
      - dotnet format

  game:publish-latest:
    desc: Publish latest console and Windows players via Nuke
    cmds:
      - pwsh -File build/nuke/build.ps1 --target PublishPlayers --configuration Release --Runtime win-x64

  game:run-latest-console:
    desc: Publish and run latest console player (run this inside Rio)
    deps:
      - game:publish-latest
    cmds:
      - pwsh -Command "Set-Location build/_artifacts/latest/PigeonPea.Console; ./PigeonPea.Console.exe"

  game:build-console:
    desc: Build console (and windows) players via Nuke PublishPlayers only
    cmds:
      - pwsh -File build/nuke/build.ps1 --target PublishPlayers --configuration Release --Runtime win-x64

  game:run-console:
    desc: Run console player from latest artifacts in Rio terminal (plugin renderer + modern-edgar)
    cmds:
      - pwsh -File build/nuke/scripts/launch-console-rio.ps1

  game:build-and-run-console:
    desc: Build console via Nuke, then run from latest artifacts in Rio (plugin renderer + modern-edgar)
    deps:
      - game:build-console
    cmds:
      - task game:run-console

  # PTY test helpers (Node.js)
  pty:install:
    desc: Install Node.js deps for PTY tests
    dir: ./tests/pty
    cmds:
      - npm ci

  pty:test:
    desc: Run PTY basic movement test
    dir: ./tests/pty
    cmds:
      - npm test

  # Developer environment helpers
  env:check-terminal:
    desc: Check terminal environment and WezTerm info (Windows)
    cmds:
      - scripts\\devtools\\check-terminal.bat

  env:which-wezterm:
    desc: Locate wezterm and test imgcat (Windows)
    cmds:
      - scripts\\devtools\\which-wezterm.bat

  env:test-with-env:
    desc: Run console app with kitty env vars (Windows)
    cmds:
      - scripts\\devtools\\test-with-env.bat

  wezterm:launch:
    desc: Launch pinned WezTerm instance (Windows)
    cmds:
      - scripts\\devtools\\launch-new-wezterm.bat

  dev:setup-pre-commit:win:
    desc: Setup pre-commit hooks (Windows PowerShell)
    cmds:
      - pwsh -File scripts/devtools/setup-pre-commit.ps1

  dev:setup-pre-commit:unix:
    desc: Setup pre-commit hooks (bash)
    cmds:
      - bash scripts/devtools/setup-pre-commit.sh

  # MCP (Model Context Protocol) setup helpers
  mcp:detect-ides:
    desc: Detect installed IDEs and their MCP config paths
    cmds:
      - python .mcp/scripts/detect-ide-configs.py

  mcp:detect-ides:win:
    desc: Detect installed IDEs and their MCP config paths (Windows PowerShell)
    cmds:
      - pwsh -File .mcp/scripts/detect-ide-configs.ps1

  mcp:detect-ides:json:
    desc: Detect installed IDEs and output as JSON
    cmds:
      - python .mcp/scripts/detect-ide-configs.py --json

  mcp:setup:win:
    desc: Setup MCP project launcher (Windows - interactive)
    cmds:
      - pwsh -File .mcp/setup-windows.ps1

  mcp:setup:unix:
    desc: Setup MCP project launcher (Linux/Mac - interactive)
    cmds:
      - bash .mcp/setup-unix.sh

  mcp:install-launcher:win:
    desc: Install MCP launcher to global location (Windows - non-interactive)
    cmds:
      - >-
        pwsh -Command
        "New-Item -ItemType Directory -Force -Path \"$env:USERPROFILE\.local\mcp-launcher\" | Out-Null;
        Copy-Item .mcp\launcher\launcher.py \"$env:USERPROFILE\.local\mcp-launcher\";
        Write-Host 'Launcher installed to $env:USERPROFILE\.local\mcp-launcher\launcher.py' -ForegroundColor Green"

  mcp:install-launcher:unix:
    desc: Install MCP launcher to global location (Linux/Mac - non-interactive)
    cmds:
      - >-
        bash -c "mkdir -p ~/.local/mcp-launcher &&
        cp .mcp/launcher/launcher.py ~/.local/mcp-launcher/ &&
        chmod +x ~/.local/mcp-launcher/launcher.py &&
        echo 'Launcher installed to ~/.local/mcp-launcher/launcher.py'"

  mcp:test-launcher:
    desc: Test the MCP launcher (requires launcher to be installed)
    cmds:
      - >-
        python ~/.local/mcp-launcher/launcher.py github --help ||
        python "$env:USERPROFILE\.local\mcp-launcher\launcher.py" github --help

  mcp:docs:
    desc: Open MCP setup documentation
    cmds:
      - cmd: |
          {{if eq OS "windows"}}
          start .mcp\README.md
          {{else}}
          open .mcp/README.md || xdg-open .mcp/README.md
          {{end}}

  images:create-battle:
    desc: Generate sample battle image (Pillow)
    cmds:
      - python3 scripts/assets/create_battle_image.py

  images:create-test:
    desc: Generate 32x32 red test image (Pillow)
    cmds:
      - python3 scripts/assets/create_test_image.py

  python:install-dev:
    desc: Install Python dev dependencies
    cmds:
      - python -m pip install -r requirements/dev.txt

  # Rust build tasks
  rust:install-cargo-make:
    desc: Install cargo-make build tool
    cmds:
      - cargo install --force cargo-make

  rust:build:debug:
    desc: Build Rust dev-tool-server (debug)
    dir: ./build/rust
    cmds:
      - cargo make build-debug

  rust:build:release:
    desc: Build Rust dev-tool-server (release)
    dir: ./build/rust
    cmds:
      - cargo make build-release

  rust:test:
    desc: Run Rust tests
    dir: ./build/rust
    cmds:
      - cargo make test

  rust:publish:
    desc: Build and publish versioned Rust artifacts
    dir: ./build/rust
    cmds:
      - cargo make publish

  rust:clean:
    desc: Clean Rust build artifacts
    dir: ./build/rust
    cmds:
      - cargo make clean

  rust:run-latest:
    desc: Launch Rio terminal with latest built dev-tool-server
    cmds:
      - pwsh -File build/rust/scripts/launch-latest.ps1

  rust:build-and-run:
    desc: Build, publish, and run latest dev-tool-server in Rio
    deps:
      - rust:publish
    cmds:
      - task rust:run-latest

  fonts:generate-svgs:
    desc: Generate 36 angle SVGs for font import
    dir: .
    cmds:
      - python3 fonts/scripts/generate_angle_svgs.py

  fonts:build:regular:
    desc: Patch Regular font with PUA angles (requires FontForge)
    dir: .
    cmds:
      - |
        if [ -z "${BASE_FONT_REGULAR}" ]; then \
          echo "Set BASE_FONT_REGULAR to Sarasa Fixed CL Regular TTF path" && exit 1; fi
      - |
        fontforge -script fonts/scripts/patch_sarasa.py \
          --base "${BASE_FONT_REGULAR}" \
          --output fonts/dist/LunarSarasaMono-Regular.ttf \
          --svg-dir fonts/src/svg/lines

  fonts:build:bold:
    desc: Patch Bold font with PUA angles (requires FontForge)
    dir: .
    cmds:
      - |
        if [ -z "${BASE_FONT_BOLD}" ]; then \
          echo "Set BASE_FONT_BOLD to Sarasa Fixed CL Bold TTF path" && exit 1; fi
      - |
        fontforge -script fonts/scripts/patch_sarasa.py \
          --base "${BASE_FONT_BOLD}" \
          --output fonts/dist/LunarSarasaMono-Bold.ttf \
          --svg-dir fonts/src/svg/lines

  fonts:build:
    desc: Build Regular and Bold patched fonts
    deps:
      - fonts:generate-svgs
      - fonts:build:regular
      - fonts:build:bold

  fonts:test:
    desc: Basic check for generated fonts
    dir: .
    cmds:
      - bash -lc "ls -l fonts/dist/*.ttf || true"

  bundle:rio:dev:
    desc: Create a dev bundle skeleton (no Rio binaries)
    dir: .
    cmds:
      - mkdir -p bundle/fonts bundle/config bundle/app
      - bash -lc "cp -f fonts/dist/*.ttf bundle/fonts/ 2>/dev/null || true"
      - |
        bash -lc 'cat > bundle/config/rio.toml <<EOF
        [fonts]
        normal = { family = "Lunar Sarasa Mono" }
        bold   = { family = "Lunar Sarasa Mono" }
        italic = { family = "Lunar Sarasa Mono" }
        EOF'

  default:
    desc: Show available tasks
    cmds:
      - task --list
