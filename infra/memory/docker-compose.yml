# Memory Infrastructure
# DO NOT START YET - Wait until dotnet reorganization is complete
#
# To start: docker compose -f docker-compose.memory.yml up -d
# To stop:  docker compose -f docker-compose.memory.yml down

services:
  # Vector database for embeddings (when ready to add semantic search)
  qdrant:
    image: qdrant/qdrant:latest
    container_name: pigeon-pea-qdrant
    ports:
      - "6333:6333"  # HTTP API
      - "6334:6334"  # gRPC (optional)
    volumes:
      - ./data:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
    restart: unless-stopped
    networks:
      - memory-net

  # Optional: Qdrant web UI for inspecting vectors
  qdrant-web-ui:
    image: qdrant/qdrant:latest
    container_name: pigeon-pea-qdrant-ui
    ports:
      - "6333:6333"
    depends_on:
      - qdrant
    networks:
      - memory-net
    profiles:
      - ui  # Only start with: --profile ui

networks:
  memory-net:
    driver: bridge

# Usage Notes:
# 1. Start: cd infra/memory && docker compose up -d
# 2. Access UI: http://localhost:6333/dashboard
# 3. Check logs: docker compose logs -f
# 4. Stop: docker compose down
#
# Cost: $0 (self-hosted, uses local disk)
# Storage: infra/memory/data/ (gitignored)
