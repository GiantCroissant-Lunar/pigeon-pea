---
# Ansible inventory for pigeon-pea development environment
# This setup targets localhost for local development

all:
  hosts:
    localhost:
      ansible_connection: local
      ansible_python_interpreter: "{{ ansible_playbook_python }}"

  vars:
    # Project paths (relative to project root)
    project_root: "{{ playbook_dir }}/../.."
    memory_path: "{{ playbook_dir }}/../memory"

    # Platform-specific settings
    is_wsl: "{{ (ansible_kernel is defined and 'microsoft' in ansible_kernel.lower()) | bool }}"
