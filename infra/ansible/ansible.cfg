[defaults]
# Ansible configuration for pigeon-pea development environment

# Inventory
inventory = inventory/hosts.yml

# Roles path
roles_path = roles

# Disable host key checking for localhost
host_key_checking = False

# Display settings
stdout_callback = yaml
bin_ansible_callbacks = True

# Performance
gathering = smart
fact_caching = jsonfile
fact_caching_connection = /tmp/ansible_facts
fact_caching_timeout = 3600

# Logging (optional - uncomment to enable)
# log_path = ansible.log

# Privilege escalation
become_ask_pass = False

[inventory]
# Enable YAML inventory plugin
enable_plugins = yaml, ini

[privilege_escalation]
# Sudo settings
become = False
become_method = sudo
become_user = root
become_ask_pass = False

[ssh_connection]
# SSH settings (not used for localhost but included for completeness)
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=60s
